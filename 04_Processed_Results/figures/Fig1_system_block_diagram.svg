<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
  <defs>
    <marker id="arrow_teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00706b"/>
    </marker>
    <marker id="arrow_blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f6f9f"/>
    </marker>
    <marker id="arrow_orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a66100"/>
    </marker>
    <style>
      .title { font: 700 26px Georgia, 'Times New Roman', serif; fill: #00706b; letter-spacing: 1px; }
      .box { fill: #f4f6f7; stroke: #4d575c; stroke-width: 3; rx: 10; }
      .bluebox { fill: #e7f2fb; stroke: #1f6f9f; stroke-width: 3; rx: 10; }
      .orangebox { fill: #fbf0dc; stroke: #a66100; stroke-width: 3; rx: 10; }
      .ctrlbox { fill: #e3f4f2; stroke: #00706b; stroke-width: 3; rx: 10; }
      .label { font: 23px Georgia, 'Times New Roman', serif; fill: #1d252b; }
      .small { font: 17px Georgia, 'Times New Roman', serif; fill: #1d252b; }
      .blue { fill: #1f6f9f; }
      .orange { fill: #a66100; }
      .rule { stroke: #c8d0d4; stroke-width: 2; }
      .teal_line { stroke: #00706b; stroke-width: 5; fill: none; marker-end: url(#arrow_teal); }
      .blue_line { stroke: #1f6f9f; stroke-width: 4; fill: none; marker-end: url(#arrow_blue); }
      .orange_line { stroke: #a66100; stroke-width: 4; fill: none; marker-end: url(#arrow_orange); }
    </style>
  </defs>

  <text x="35" y="45" class="title">CURRENT-LIMITED POWER PATH</text>
  <line x1="35" y1="210" x2="1165" y2="210" class="rule"/>
  <text x="880" y="517" class="title">SUPERVISORY LINK</text>
  <line x1="35" y1="535" x2="1165" y2="535" class="rule"/>

  <rect x="35" y="78" width="190" height="76" class="box"/>
  <text x="130" y="108" text-anchor="middle" class="label">Current-limited</text>
  <text x="130" y="136" text-anchor="middle" class="label">DC supply</text>

  <rect x="285" y="78" width="245" height="76" class="bluebox"/>
  <text x="407" y="108" text-anchor="middle" class="label">Current monitor</text>
  <text x="407" y="136" text-anchor="middle" class="label">and series load</text>

  <rect x="625" y="78" width="250" height="76" class="orangebox"/>
  <text x="750" y="108" text-anchor="middle" class="label">Power MOSFET</text>
  <text x="750" y="136" text-anchor="middle" class="label">test stage</text>

  <rect x="950" y="78" width="210" height="76" class="box"/>
  <text x="1055" y="108" text-anchor="middle" class="label">Common</text>
  <text x="1055" y="136" text-anchor="middle" class="label">DC return</text>

  <path d="M225 116 H285" class="teal_line"/>
  <path d="M530 116 H625" class="teal_line"/>
  <path d="M875 116 H950" class="teal_line"/>

  <rect x="390" y="285" width="465" height="155" class="ctrlbox"/>
  <text x="622" y="338" text-anchor="middle" class="label" font-weight="700">Embedded bias controller</text>
  <text x="622" y="370" text-anchor="middle" class="label" font-weight="700">current PID plus NTC feed-forward</text>
  <text x="622" y="402" text-anchor="middle" class="label" font-weight="700">arming plus latched protection</text>

  <rect x="45" y="330" width="270" height="82" class="orangebox"/>
  <text x="180" y="362" text-anchor="middle" class="label">Package-adjacent</text>
  <text x="180" y="390" text-anchor="middle" class="label">NTC sensor</text>

  <path d="M315 371 H390" class="orange_line"/>
  <path d="M470 154 L548 285" class="blue_line"/>
  <text x="408" y="240" class="small blue">digital current</text>
  <text x="408" y="262" class="small blue">feedback</text>
  <path d="M760 285 V154" class="orange_line"/>
  <text x="810" y="240" class="small orange">bounded gate-bias</text>
  <text x="810" y="262" class="small orange">command</text>

  <rect x="45" y="580" width="335" height="84" class="box"/>
  <text x="212" y="612" text-anchor="middle" class="label">Host configuration,</text>
  <text x="212" y="640" text-anchor="middle" class="label">logging and remote STOP</text>

  <rect x="470" y="594" width="255" height="70" class="bluebox"/>
  <text x="598" y="622" text-anchor="middle" class="label">Classical CAN</text>
  <text x="598" y="650" text-anchor="middle" class="label">supervisory only</text>

  <path d="M725 629 H790 V440" class="blue_line"/>
  <path d="M470 629 H380" class="blue_line"/>
</svg>
